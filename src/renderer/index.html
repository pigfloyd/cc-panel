<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>cc-panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="cards"></main>
  <div id="empty" class="empty hidden">
    <img class="empty-icon" src="../assets/app-icon.png" alt="" />
    <p>还没有 Claude Code 或 Codex 会话</p>
    <p class="hint">打开终端后启动 <code>claude</code> 或 <code>codex</code>，<br/>会话卡片会自动出现在这里</p>
  </div>
  <nav class="bottom-toolbar" aria-label="终端操作">
    <button id="btn-settings" class="icon-btn" type="button" title="设置" aria-label="设置">&#9881;</button>
    <button id="btn-collapse-terminals" class="icon-btn" type="button" title="收起所有终端窗口（Ctrl+Shift+Z）" aria-label="收起所有终端窗口，快捷键 Ctrl+Shift+Z">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 4h12a2 2 0 0 1 2 2v7" />
        <path d="M4 8h12a2 2 0 0 1 2 2v3" />
        <path d="m9 16 3 3 3-3M12 19v-7" />
      </svg>
    </button>
    <div class="new-terminal-control">
      <button id="btn-claude-terminal" class="toolbar-btn toolbar-btn-primary" type="button" aria-haspopup="menu" aria-expanded="false">Claude Code</button>
      <button id="btn-codex-terminal" class="toolbar-btn toolbar-btn-primary" type="button" aria-haspopup="menu" aria-expanded="false">Codex CLI</button>
      <div id="terminal-history-menu" class="terminal-history-menu hidden" role="menu" aria-label="最近使用的终端路径"></div>
    </div>
  </nav>
  <section id="settings-panel" class="settings-panel hidden" aria-label="设置">
    <label class="setting-row" for="setting-always-on-top">
      <span>窗口置顶</span>
      <input id="setting-always-on-top" type="checkbox" />
    </label>
    <label class="setting-row" for="setting-sound">
      <span>状态提示音</span>
      <input id="setting-sound" type="checkbox" />
    </label>
    <label class="setting-row" for="setting-auto-launch">
      <span>开机自启动</span>
      <input id="setting-auto-launch" type="checkbox" />
    </label>
    <div class="setting-row">
      <span>终端程序</span>
      <select id="setting-terminal-executable" class="setting-terminal-select" aria-label="终端程序">
        <option value="">正在扫描...</option>
      </select>
    </div>
    <div class="hook-status-group" aria-label="Hook 诊断">
      <div class="setting-section-label">Hook 诊断</div>
      <div class="hook-status-row">
        <span>最近事件</span>
        <span id="hook-last-event" class="hook-status-value">尚未收到</span>
      </div>
      <div class="hook-status-row">
        <span>事件服务</span>
        <span id="hook-event-service" class="hook-status" data-status="unknown">检测中</span>
      </div>
      <div class="hook-status-row">
        <span>Claude Hook</span>
        <span id="claude-hook-status" class="hook-status" data-status="not_installed">未安装</span>
      </div>
      <div class="hook-status-row">
        <span>Codex Hook</span>
        <span id="codex-hook-status" class="hook-status" data-status="not_installed">未安装</span>
      </div>
      <div class="hook-status-row">
        <span>Codex 信任</span>
        <span id="codex-trust-status" class="hook-status" data-status="unknown">--</span>
      </div>
      <div class="hook-status-row">
        <span>降级模式</span>
        <span id="hook-fallback-mode" class="hook-status-value">检测中</span>
      </div>
      <div class="hook-actions" aria-label="Hook 操作">
        <button id="btn-hook-inspect" type="button">重新检测</button>
        <button id="btn-hook-install" type="button">重新安装</button>
        <button id="btn-hook-help" type="button" aria-expanded="false">查看解决步骤</button>
        <button id="btn-hook-uninstall" class="danger" type="button">卸载</button>
      </div>
      <div id="hook-resolution" class="hook-resolution hidden" aria-live="polite">
        <strong id="hook-resolution-title">Hook 解决步骤</strong>
        <p id="hook-resolution-message"></p>
        <div id="codex-trust-actions" class="codex-trust-actions hidden">
          <button id="btn-open-codex-trust" type="button">打开 Codex</button>
          <button id="btn-copy-hooks-command" type="button">复制 /hooks</button>
          <button id="btn-check-codex-trust" type="button">完成后检测</button>
        </div>
      </div>
    </div>
  </section>
  <div id="toast" class="toast hidden"></div>
  <script src="session-order.js"></script>
  <script src="session-meta.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
