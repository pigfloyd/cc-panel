<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>cc-panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="compact-view" class="compact-view" aria-label="会话摘要">
    <button id="btn-expand" class="compact-summary" type="button" title="恢复完整模式">
      <span id="compact-status" class="compact-status" aria-hidden="true"></span>
      <span class="compact-copy">
        <strong id="compact-title">暂无会话</strong>
        <span id="compact-detail">等待会话启动</span>
      </span>
      <span id="compact-attention" class="compact-attention hidden"></span>
      <span class="compact-expand" aria-hidden="true">&#8599;</span>
    </button>
  </section>
  <main id="cards"></main>
  <div id="empty" class="empty hidden">
    <p>还没有 Claude Code 或 Codex 会话</p>
    <p class="hint">打开终端后启动 <code>claude</code> 或 <code>codex</code>，<br/>会话卡片会自动出现在这里</p>
  </div>
  <nav class="bottom-toolbar" aria-label="终端操作">
    <button id="btn-settings" class="icon-btn" type="button" title="设置" aria-label="设置">&#9881;</button>
    <button id="btn-compact" class="icon-btn" type="button" title="缩小模式" aria-label="进入缩小模式">&#8601;</button>
    <button id="btn-collapse-terminals" class="icon-btn" type="button" title="收起所有终端窗口" aria-label="收起所有终端窗口">&#8212;</button>
    <div class="new-terminal-control">
      <button id="btn-claude-terminal" class="toolbar-btn toolbar-btn-primary" type="button">Claude Code</button>
      <button id="btn-codex-terminal" class="toolbar-btn toolbar-btn-primary" type="button">Codex CLI</button>
    </div>
  </nav>
  <section id="settings-panel" class="settings-panel hidden" aria-label="设置">
    <label class="setting-row" for="setting-always-on-top">
      <span>窗口置顶</span>
      <input id="setting-always-on-top" type="checkbox" />
    </label>
    <label class="setting-row" for="setting-sound">
      <span>状态提示音</span>
      <input id="setting-sound" type="checkbox" />
    </label>
    <label class="setting-row" for="setting-auto-launch">
      <span>开机自启动</span>
      <input id="setting-auto-launch" type="checkbox" />
    </label>
    <div class="setting-row">
      <span>终端程序</span>
      <select id="setting-terminal-executable" class="setting-terminal-select" aria-label="终端程序">
        <option value="">正在扫描...</option>
      </select>
    </div>
  </section>
  <div id="toast" class="toast hidden"></div>
  <script src="session-order.js"></script>
  <script src="session-meta.js"></script>
  <script src="session-summary.js"></script>
  <script src="app.js"></script>
</body>
</html>
