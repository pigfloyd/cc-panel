<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>cc-panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="floating-actions" aria-label="操作">
    <button id="btn-terminal" class="icon-btn terminal-btn" title="打开 Windows Terminal">WT</button>
    <button id="btn-collapse-terminals" class="icon-btn" title="一键收起所有终端" aria-label="一键收起所有终端">-</button>
    <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
  </div>
  <section id="permissions" class="permissions hidden" aria-label="待处理权限请求"></section>
  <main id="cards"></main>
  <div id="empty" class="empty hidden">
    <p>还没有 Claude Code 会话</p>
    <p class="hint">在任意 Windows Terminal 里启动 <code>claude</code> 后，<br/>会话卡片会自动出现在这里</p>
  </div>
  <section id="settings-panel" class="settings-panel hidden" aria-label="设置">
    <label class="setting-row" for="setting-always-on-top">
      <span>窗口置顶</span>
      <input id="setting-always-on-top" type="checkbox" />
    </label>
    <label class="setting-row" for="setting-sound">
      <span>状态提示音</span>
      <input id="setting-sound" type="checkbox" />
    </label>
    <label class="setting-row" for="setting-auto-launch">
      <span>开机自启动</span>
      <input id="setting-auto-launch" type="checkbox" />
    </label>
  </section>
  <div id="toast" class="toast hidden"></div>
  <script src="session-order.js"></script>
  <script src="session-meta.js"></script>
  <script src="app.js"></script>
</body>
</html>
